<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lab 3</title>
        <link rel="stylesheet" href="css/stylesheet.css">
    </head>
    <body>
        <header>
            <h1> Sequencing</h1>
                <p>Same three images. Different order.A completely different story </p>

                <div class="version-buttons"> 
                    <button id="btnA" class="version-btn active">Version A: A Makeup </button>
                    <button id="btnB" class="version-btn">Version B: The Breakup</button>
                </div>
            </header>
            <main>
                 <h2 id="storyTitle"> Version A:The Makeup </h2>
                 <p id="stage">Beginning (1 of 3) </p>
                 <img id="mainImage" src="images/argue.jpg" alt="Two people arguing">
                 <p id="caption"> It started with a fight. Neither of them would back down." </p>

                 <div class="nav-buttons">
                    <button id="btnBack"> &larr; Back</button>
                    <button id="btnNext"> Next &rarr;</button>
                 </div>

                 <div class="filmstrip">
                    <img id="thumb1" src="images/argue.jpg" alt="Part 1">
                    <img id="thumb2" src="images/alone.jpg" alt="Part 2">
                    <img id="thumb3" src="images/together.jpg" alt="Part 3">
                 </div>
                 
                 <p class ="hint">Tip: you can also click the big image to move forward.</p>
            </main>
        
            <script src="js/script.js"></script>
    </body>
</html>
